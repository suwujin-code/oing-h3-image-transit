name: H3 private secret bridge probe

on:
  workflow_call:
    secrets:
      H3_API_KEY_A:
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      H3_API_KEY_A: ${{ secrets.H3_API_KEY_A }}
    steps:
      - name: Verify caller supplied credential without revealing it
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${H3_API_KEY_A:-}" ]]
          echo 'caller_h3_credential_available=true'
