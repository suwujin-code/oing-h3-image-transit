name: Publish transit image

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish changed base64 payload as binary image
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: main
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          branch=os.environ['BRANCH']
          head=os.environ['HEAD_SHA']
          names=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','--diff-filter=AM','-r',head],
              text=True,
          ).splitlines()
          files=[Path(p) for p in names if p.startswith('incoming/') and p.endswith('.b64')]
          if not files:
              print('No added/modified incoming payload; cleanup-only push, nothing to publish.')
              raise SystemExit(0)
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one changed incoming payload, got: {names}')

          src=files[0]
          target=src.name[:-4]
          if not target.lower().endswith(('.jpg','.jpeg','.png','.webp')):
              raise SystemExit(f'Unsupported target extension: {target}')
          content=''.join(src.read_text().split())
          raw=base64.b64decode(content, validate=True)
          if len(raw) < 100:
              raise SystemExit(f'Payload too small: {src}')

          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          def request(method, url, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status, json.load(r) if r.length != 0 else {}
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  print('HTTP_ERROR',method,url,e.code,body)
                  raise

          target_api=f'https://api.github.com/repos/{repo}/contents/images/{target}'
          target_sha=None
          try:
              _, existing=request('GET',target_api+'?ref='+branch)
              target_sha=existing.get('sha')
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          payload={'message':f'publish: {target}','content':content,'branch':branch}
          if target_sha:
              payload['sha']=target_sha
          _, published=request('PUT',target_api,payload)
          print('published',target,'bytes',len(raw),'commit',published.get('commit',{}).get('sha'))

          source_sha=subprocess.check_output(['git','rev-parse',f'{head}:{src.as_posix()}'],text=True).strip()
          source_api=f'https://api.github.com/repos/{repo}/contents/{src.as_posix()}'
          _, removed=request('DELETE',source_api,{
              'message':f'cleanup: remove payload for {target}',
              'sha':source_sha,
              'branch':branch,
          })
          print('cleaned',src,'commit',removed.get('commit',{}).get('sha'))
          PY
