name: Publish transit image

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish changed base64 payload as binary image
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: main
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          branch=os.environ['BRANCH']
          head=os.environ['HEAD_SHA']
          names=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','-r',head],
              text=True,
          ).splitlines()
          files=[Path(p) for p in names if p.startswith('incoming/') and p.endswith('.b64')]
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one changed incoming payload, got: {names}')

          src=files[0]
          target=src.name[:-4]
          if not target.lower().endswith(('.jpg','.jpeg','.png','.webp')):
              raise SystemExit(f'Unsupported target extension: {target}')
          content=''.join(src.read_text().split())
          raw=base64.b64decode(content, validate=True)
          if len(raw) < 100:
              raise SystemExit(f'Payload too small: {src}')

          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          api=f'https://api.github.com/repos/{repo}/contents/images/{target}'
          sha=None
          get=urllib.request.Request(api+'?ref='+branch,headers=headers)
          try:
              with urllib.request.urlopen(get,timeout=30) as r:
                  sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          payload={'message':f'publish: {target}','content':content,'branch':branch}
          if sha:
              payload['sha']=sha
          put=urllib.request.Request(api,data=json.dumps(payload).encode(),headers=headers,method='PUT')
          try:
              with urllib.request.urlopen(put,timeout=60) as r:
                  data=json.load(r)
                  print('published',target,'bytes',len(raw),'commit',data.get('commit',{}).get('sha'))
          except urllib.error.HTTPError as e:
              print('HTTP_ERROR',e.code,e.read().decode(errors='replace'))
              raise
          PY
