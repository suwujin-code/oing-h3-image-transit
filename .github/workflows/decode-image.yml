name: Publish transit image

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish base64 payloads as binary images
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          branch=os.environ['BRANCH']
          files=sorted(Path('incoming').glob('*.b64'))
          if not files:
              raise SystemExit('No incoming payloads')

          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          for src in files:
              target=src.name[:-4]
              if not target.lower().endswith(('.jpg','.jpeg','.png','.webp')):
                  raise SystemExit(f'Unsupported target extension: {target}')
              content=''.join(src.read_text().split())
              raw=base64.b64decode(content, validate=True)
              if len(raw) < 100:
                  raise SystemExit(f'Payload too small: {src}')

              api=f'https://api.github.com/repos/{repo}/contents/images/{target}'
              sha=None
              get=urllib.request.Request(api+'?ref='+branch,headers=headers)
              try:
                  with urllib.request.urlopen(get,timeout=30) as r:
                      sha=json.load(r).get('sha')
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise

              payload={
                  'message': f'publish: {target}',
                  'content': content,
                  'branch': branch,
              }
              if sha:
                  payload['sha']=sha
              put=urllib.request.Request(api,data=json.dumps(payload).encode(),headers=headers,method='PUT')
              try:
                  with urllib.request.urlopen(put,timeout=60) as r:
                      data=json.load(r)
                      print('published',target,'bytes',len(raw),'commit',data.get('commit',{}).get('sha'))
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR',e.code,e.read().decode(errors='replace'))
                  raise
          PY
