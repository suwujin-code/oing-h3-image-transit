name: H3 secret presence probe

on:
  push:
    branches: [main]
    paths:
      - 'probe/h3-secret-presence.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEY_A: ${{ secrets.AUTODL_COMFYUI_API_KEY }}
      KEY_B: ${{ secrets.AUTODL_COMFYUI_API_KEY_B }}
      KEY_C: ${{ secrets.AUTODL_COMFYUI_API_KEY_C }}
    steps:
      - name: Verify at least one H3 credential is available without revealing it
        shell: bash
        run: |
          set -euo pipefail
          count=0
          [[ -n "${KEY_A:-}" ]] && count=$((count+1))
          [[ -n "${KEY_B:-}" ]] && count=$((count+1))
          [[ -n "${KEY_C:-}" ]] && count=$((count+1))
          echo "available_h3_credentials=$count"
          [[ "$count" -gt 0 ]]
